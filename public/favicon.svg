<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#07090e"/>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>
  <!-- Tactical Shield -->
  <path d="M256 60 L400 120 V270 C400 370 256 450 256 450 C256 450 112 370 112 270 V120 Z" fill="#0d111a" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Cross Swords / X -->
  <path d="M180 180 L332 332" stroke="url(#shieldGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M332 180 L180 332" stroke="url(#bladeGrad)" stroke-width="26" stroke-linecap="round"/>
  <!-- Core Energy Ring -->
  <circle cx="256" cy="256" r="24" fill="#07090e" stroke="#ffffff" stroke-width="8"/>
  <circle cx="256" cy="256" r="10" fill="#ff2a5f"/>
</svg>